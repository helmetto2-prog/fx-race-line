name: LINE waku shirabe (ichido kiri)
# 2026-10-18 まとん：LINEの枠の調べ用。表示名・@ID・数だけ出す（トークン・userIdは出さない）。終わったら消す。
on:
  workflow_dispatch: {}
jobs:
  shirabe:
    runs-on: ubuntu-latest
    steps:
      - name: Shirabe
        env:
          T: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          cat > s.mjs <<'JS'
          const h = { Authorization: `Bearer ${process.env.T}` };
          const g = async (p) => { const r = await fetch("https://api.line.me" + p, { headers: h }); let j = null; try { j = await r.json(); } catch {} return { s: r.status, j }; };
          const info = await g("/v2/bot/info");
          console.log("INFO", info.s, JSON.stringify({ displayName: info.j?.displayName, basicId: info.j?.basicId }));
          const q = await g("/v2/bot/message/quota");
          console.log("QUOTA", q.s, JSON.stringify(q.j));
          const c = await g("/v2/bot/message/quota/consumption");
          console.log("CONSUMPTION", c.s, JSON.stringify(c.j));
          const days = [];
          const sl = (ms) => new Promise(r => setTimeout(r, ms));
          for (let d = 3; d <= 17; d++) days.push(`202610${String(d).padStart(2, "0")}`);
          for (const d of days) { let r; for (let k = 0; k < 4; k++) { r = await g(`/v2/bot/insight/message/delivery?date=${d}`); if (r.s !== 429) break; await sl(60000); } console.log("DELIVERY", d, r.s, JSON.stringify(r.j)); await sl(15000); }
          const f = await g("/v2/bot/insight/followers?date=20261017");
          console.log("FOLLOWERS", f.s, JSON.stringify(f.j));
          JS
          node s.mjs
